name: Deploy wqide

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-wqide.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "d/articles/**"
      - "wq-wasm/**"
      - "wqide/**"
      - "wqpl/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wqide/package-lock.json

      - name: Install dependencies
        working-directory: wqide
        run: npm ci

      - name: Build site
        working-directory: wqide
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wqide/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
