name: Publish crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace or package to validate or recover
        required: true
        default: all
        type: choice
        options:
          - all
          - wq-dap
          - wq-rl
          - wqpl
          - wq-cli
          - wq-wasm
          - wqls
      publish:
        description: Publish from the selected release tag instead of a dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate workspace packages
        if: inputs.package == 'all'
        run: cargo publish --workspace --locked --dry-run

      - name: Validate package
        if: inputs.package != 'all'
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            wq-dap|wq-rl|wqpl|wq-cli|wq-wasm|wqls) ;;
            *) echo "unsupported package '$PACKAGE'" >&2; exit 1 ;;
          esac
          cargo publish --package "$PACKAGE" --locked --dry-run

  publish:
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "publishing requires a release tag ref" >&2
            exit 1
          fi
          workspace_version="$(
            cargo metadata --format-version 1 --no-deps --locked |
              jq -er '[.packages[].version] | unique | if length == 1 then .[0] else error("workspace package versions differ") end'
          )"
          if [ "$RELEASE_TAG" != "v$workspace_version" ]; then
            echo "release tag '$RELEASE_TAG' does not match workspace version '$workspace_version'" >&2
            exit 1
          fi

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

      - name: Recover package publish
        if: github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = "all" ]; then
            cargo publish --workspace --locked
          else
            case "$PACKAGE" in
              wq-dap|wq-rl|wqpl|wq-cli|wq-wasm|wqls) ;;
              *) echo "unsupported package '$PACKAGE'" >&2; exit 1 ;;
            esac
            cargo publish --package "$PACKAGE" --locked
          fi
