name: Build Binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_release_assets:
        description: Package binaries for a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.artifact_platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_platform: Linux
            executable_suffix: ""
          - os: windows-latest
            artifact_platform: Windows
            executable_suffix: .exe
          - os: macos-latest
            artifact_platform: macOS
            executable_suffix: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binaries
        run: cargo build --locked --release --package wq-cli --package wqls

      - name: Package Unix release assets
        if: inputs.package_release_assets && runner.os != 'Windows'
        env:
          ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          archive="wq-${RELEASE_TAG}-${ARTIFACT_PLATFORM}.tar.gz"
          tar -C target/release -czf "$GITHUB_WORKSPACE/$archive" wq wqls

      - name: Package Windows release assets
        if: inputs.package_release_assets && runner.os == 'Windows'
        env:
          ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $archive = "wq-$env:RELEASE_TAG-$env:ARTIFACT_PLATFORM.zip"
          Compress-Archive `
            -Path target/release/wq.exe, target/release/wqls.exe `
            -DestinationPath "$env:GITHUB_WORKSPACE/$archive"

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact_platform }}
          path: |
            target/release/wq${{ matrix.executable_suffix }}
            target/release/wqls${{ matrix.executable_suffix }}
          if-no-files-found: error

      - name: Upload release asset
        if: inputs.package_release_assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact_platform }}
          path: wq-${{ github.ref_name }}-${{ matrix.artifact_platform }}.*
          if-no-files-found: error
