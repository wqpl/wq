name: Publish wq-wasm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-wq-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install publishing tools
        run: |
          npm install --global npm@11.18.0
          npm install --global wasm-pack@0.15.0

      - name: Build package
        working-directory: wq-wasm
        run: npm run build

      - name: Test publishing scripts
        run: >-
          python3 -m unittest discover
          -s publish-scripts
          -t publish-scripts
          -p 'test_*.py'

      - name: Verify package metadata
        id: package
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 publish-scripts/check_package.py

      - name: Test browser package
        working-directory: wq-wasm
        run: npm test

      - name: Inspect package contents
        working-directory: wq-wasm
        run: npm pack --dry-run

      - name: Publish package
        if: github.event_name == 'push'
        working-directory: wq-wasm
        run: npm publish --access public --tag "${{ steps.package.outputs.npm_tag }}"
