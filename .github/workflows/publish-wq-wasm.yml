name: Publish wq-wasm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-wq-wasm-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install publishing tools
        run: |
          npm install --global npm@11.18.0
          npm install --global wasm-pack@0.15.0

      - name: Build package
        working-directory: wq-wasm
        run: npm run build

      - name: Verify package metadata
        id: package
        working-directory: wq-wasm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run check

      - name: Test browser package
        working-directory: wq-wasm
        run: npm test

      - name: Inspect package contents
        working-directory: wq-wasm
        run: npm pack --dry-run

      - name: Publish package
        if: github.event_name == 'release'
        working-directory: wq-wasm
        run: npm publish --access public --tag "${{ steps.package.outputs.npm_tag }}"
