name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          workspace_version="$(
            cargo metadata --format-version 1 --no-deps --locked |
              jq -er '[.packages[].version] | unique | if length == 1 then .[0] else error("workspace package versions differ") end'
          )"
          if [ "$RELEASE_TAG" != "v$workspace_version" ]; then
            echo "release tag '$RELEASE_TAG' does not match workspace version '$workspace_version'" >&2
            exit 1
          fi

  build:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      package_release_assets: true

  release:
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 publish-scripts/release_notes.py
          "$RELEASE_TAG"
          --output release-notes.md

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
