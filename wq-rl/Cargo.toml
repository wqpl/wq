[package]
name = "wq-rl"
version = "18.0.0"
edition = "2024"
license = "MIT"

[features]
case_insensitive_history_search = ["regex"]
custom-bindings = ["radix_trie"]
default = ["custom-bindings", "with-dirs", "with-file-history"]
derive = ["rustyline-derive"]
with-dirs = ["home"]
with-file-history = []
with-fuzzy = ["skim"]
with-sqlite-history = ["rusqlite"]

[dependencies]
bitflags = "2.13"
cfg-if = "1.0.4"
libc = "0.2.186"
log = "0.4.33"
memchr = "2.8"
unicode-segmentation = "1.13"
unicode-width = "0.2.2"

home = { version = "0.5.12", optional = true }
radix_trie = { version = "0.3", optional = true }
regex = { version = "1.12.4", optional = true }
rusqlite = { version = "0.39.0", optional = true, default-features = false, features = ["bundled", "cache", "backup", "fallible_uint"] }
rustyline-derive = { version = "0.12.0", optional = true }

[target.'cfg(unix)'.dependencies]
buffer-redux = { version = "1.1", optional = true, default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["fs", "ioctl", "poll", "signal", "term"] }
signal-hook = { version = "0.4.4", optional = true, default-features = false }
skim = { version = "4.10.0", optional = true, default-features = false }
termios = { version = "0.3.3", optional = true }
utf8parse = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3.27.0"
