[package]
name = "wqpl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The wq Programming Language"
readme.workspace = true
publish.workspace = true

[dependencies]
rand.workspace = true
indexmap = "2.14.0"
ordered-float = "5.3.0"
encoding_rs = "0.8.35"
ahash = "0.8"
num-bigint = "0.4.8"
num-complex = "0.4.6"
num-traits = "0.2.19"
libm = "0.2"
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
unicode-ident = "1.0"
unicode_names2 = "3.1.0"
icu_casemap = { version = "2.2.0", features = ["compiled_data"] }
rayon = "1.12.0"
num-rational = "0.4.2"
smallvec = "1.15.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
terminal_size = "0.4"
