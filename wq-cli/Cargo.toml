[package]
name = "wq-cli"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The wq Programming Language, CLI"

[[bin]]
name = "wq"
path = "src/main.rs"

[dependencies]
rand.workspace = true
colored.workspace = true
wqpl.workspace = true
wq-rl = { path = "../wq-rl" }
pulldown-cmark = "0.13.3"
toml = "1.1.2"
clap = { version = "4", features = ["derive"] }
wq-dap.workspace = true
serde_json = "1.0.149"
terminal_size = "0.4"

[dev-dependencies]
assert_cmd = "2"
anyhow = "1"
