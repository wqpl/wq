[workspace]
members = ["wqpl", "wq-cli", "wq-wasm", "wqls", "wq-dap", "wq-rl"]
resolver = "3"

[workspace.package]
version = "0.9.0-preview3"
edition = "2024"
license = "MIT"
repository = "https://github.com/wqpl/wq"
description = "The wq Programming Language"
readme = "README.md"
publish = ["crates-io"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
ctrlc = "3.5.2"
rand = "0.10.2"
signal-hook = "0.4.4"
wqpl = { version = "0.9.0-preview3", path = "wqpl" }
wq-dap = { version = "0.9.0-preview3", path = "wq-dap" }
wq-rl = { version = "0.9.0-preview3", path = "wq-rl" }
